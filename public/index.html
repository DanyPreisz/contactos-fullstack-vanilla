<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contactos</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Agenda</p>
      <h1>Contactos</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="app hidden">
      <header>
        <div><p class="eyebrow">Vanilla JS · Mongo</p><h1>Contactos</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <section class="layout">
        <aside class="card">
          <input id="search" type="search" placeholder="Buscar nombre, telefono o mail" />
          <nav id="tags"></nav>
        </aside>
        <section>
          <form id="contact-form" class="card form">
            <input id="name" placeholder="Nombre" maxlength="80" required />
            <input id="phone" placeholder="Telefono" maxlength="30" />
            <input id="email" placeholder="Email" maxlength="80" />
            <input id="tag" placeholder="Etiqueta" maxlength="24" />
            <input id="note" placeholder="Nota" maxlength="240" />
            <p id="form-error" class="error" hidden></p>
            <div class="row">
              <button class="primary" type="submit">Guardar</button>
              <button id="cancel" class="ghost" type="button" hidden>Cancelar</button>
              <button id="remove" class="danger" type="button" hidden>Borrar</button>
            </div>
          </form>
          <ul id="list"></ul>
        </section>
      </section>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
